# Tudo aqui é configurado pelas variáveis de ambiente da stack no Portainer
# (Stacks → sua stack → Environment variables). Não precisa editar este arquivo.
#
#   COURSES_PATH        (obrigatória) pasta dos cursos NO SERVIDOR, ex.: /mnt/hd/cursos
#   COURSE_NAME         nome do curso; vazio = cada subpasta de COURSES_PATH vira um curso
#   APP_PASSWORD        senha opcional; vazio = sem senha
#   COMPLETE_THRESHOLD  fração assistida para concluir a aula (padrão 0.9)
#   HOST_PORT           porta no servidor (padrão 3000)

services:
  aulas:
    build: .
    image: aulas:latest
    container_name: aulas
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3000}:3000"
    environment:
      COURSE_NAME: ${COURSE_NAME:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      COMPLETE_THRESHOLD: ${COMPLETE_THRESHOLD:-0.9}
    volumes:
      # Pasta dos cursos no servidor → /courses dentro do container (somente leitura)
      - ${COURSES_PATH:?Defina COURSES_PATH com a pasta dos cursos no servidor}:/courses:ro
      # Banco com o progresso
      # - aulas-data:/data

volumes:
  aulas-data:
